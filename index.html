<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>UNDERTALE Web</title>
  <script src="boxedwine.js" defer></script>
</head>
<body>
  <h1>Launching UNDERTALE...</h1>
  <div id="status">Loading BoxedWine...</div>

  <script>
    window.onload = () => {
      const status = document.getElementById("status");

      if (typeof BoxedWine === "undefined") {
        status.innerText = "❌ BoxedWine is NOT defined.\nCheck if boxedwine.js is present and loaded.";
        console.error("BoxedWine is NOT defined.");
        return;
      }

      status.innerText = "✅ BoxedWine loaded. Starting game...";

      BoxedWine({
        zip: "undertale.zip", // The ZIP file must be in the same folder as this index.html
        arguments: ["UNDERTALE.exe"]
      });
    };
  </script>
</body>
</html>
