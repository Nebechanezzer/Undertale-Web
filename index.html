<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Undertale Web</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      text-align: center;
      padding: 2em;
    }
    canvas {
      display: block;
      margin: 1em auto;
    }
  </style>
</head>
<body>
  <h1>Loading Undertale...</h1>
  <div id="output">Initializing...</div>

  <script src="boxedwine.js"></script>
  <script>
    function log(msg) {
      document.getElementById("output").innerText += "\n" + msg;
    }

    window.onload = () => {
      if (typeof BoxedWine === 'undefined') {
        log("❌ BoxedWine is NOT defined. Check script path and CORS.");
        return;
      }

      log("✅ BoxedWine script loaded. Starting game...");

      BoxedWine({
        arguments: ["/undertale_folder/Undertale.exe"],
        canvas: (() => {
          const canvas = document.createElement("canvas");
          document.body.appendChild(canvas);
          return canvas;
        })(),
        print: text => log("OUT: " + text),
        printErr: text => log("ERR: " + text),
        onAbort: () => log("❌ Aborted."),
        onExit: code => log("Game exited with code: " + code),
        mount: {
          "/undertale_folder": "undertale_folder"
        }
      });
    };
  </script>
</body>
</html>
