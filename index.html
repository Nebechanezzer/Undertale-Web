<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
  <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BoxedWine - Undertale</title>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
    }
    #canvas {
      border: 1px solid #444;
      margin-top: 20px;
    }
    #loading {
      font-size: 1.2em;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h1>Running Undertale in BoxedWine</h1>
  <canvas id="canvas" width="800" height="600"></canvas>
  <div id="loading">Loading game...</div>

  <script src="boxedwine.js"></script>
  <script>
    window.onload = async () => {
      if (typeof BoxedWine === 'undefined') {
        document.getElementById('loading').innerText = "Error: BoxedWine not loaded.";
        return;
      }

      BoxedWine({
        canvas: document.getElementById('canvas'),
        arguments: ["/undertale_folder/Undertale.exe"],
        mountPaths: {
          "/undertale_folder": "undertale_folder"
        },
        print: (text) => console.log(text),
        printErr: (err) => console.error(err),
        noInitialRun: false,
      }).then(() => {
        document.getElementById('loading').innerText = "Game is running!";
      }).catch((e) => {
        document.getElementById('loading').innerText = "Failed to load game.";
        console.error(e);
      });
    };
  </script>
</body>
</html>
