<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undertale Web</title>
  <!-- Ensure the path to boxedwine.js is correct -->
  <script src="boxedwine.js"></script>
</head>
<body>
  <h1>Launching Undertale...</h1>
  <div id="status">Checking if BoxedWine script loaded...</div>

  <script>
    window.onload = () => {
      const status = document.getElementById('status');
      // Check if BoxedWine is defined
      if (typeof BoxedWine === "undefined") {
        status.innerText = "❌ BoxedWine is NOT defined.\nCheck if boxedwine.js is present and properly linked.";
        console.error("❌ BoxedWine is NOT defined.");
      } else {
        status.innerText = "✅ BoxedWine loaded!";
        console.log("✅ BoxedWine loaded!");

        // Start the game with the correct executable name (all caps)
        BoxedWine({
          arguments: ["undertale_folder/UNDERTALE.exe"]
        });
      }
    };
  </script>
</body>
</html>
