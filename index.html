<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undertale Web</title>
  <script src="boxedwine.js" defer></script>
</head>
<body>
  <h1>Launching Undertale...</h1>
  <div id="status">Loading...</div>

  <script>
    window.onload = () => {
      const status = document.getElementById('status');
      if (typeof BoxedWine === "undefined") {
        status.innerText = "❌ BoxedWine is NOT defined.";
        return;
      }

      status.innerText = "✅ BoxedWine loaded. Starting...";

      BoxedWine({
        filesystem: [
          {
            mountPoint: "/",
            type: "zip",
            url: "https://profound-panda-70c6e6.netlify.app/undertale.zip"  // Your Netlify URL
          }
        ],
        arguments: ["UNDERTALE.exe"]  // Correct file name: UNDERTALE with capitalized letters
      });
    };
  </script>
</body>
</html>
