<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Undertale Web</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: monospace;
      text-align: center;
      margin-top: 50px;
    }
    canvas {
      display: block;
      margin: 0 auto;
    }
  </style>
</head>
<body>
  <h1>Loading Undertale...</h1>
  <div id="output"></div>

  <script src="boxedwine.js"></script>
  <script>
    if (typeof BoxedWine === 'undefined') {
      document.getElementById("output").innerText = "Error: BoxedWine failed to load.";
    } else {
      BoxedWine({
        arguments: ["Undertale.exe"],
        preRun: [],
        postRun: [],
        canvas: (function () {
          var canvas = document.createElement("canvas");
          document.body.appendChild(canvas);
          return canvas;
        })(),
        print: function (text) {
          const output = document.getElementById("output");
          output.innerText += text + "\n";
        },
        printErr: function (text) {
          const output = document.getElementById("output");
          output.innerText += "ERR: " + text + "\n";
        }
      });
    }
  </script>
</body>
</html>
