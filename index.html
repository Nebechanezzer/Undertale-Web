<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Undertale Web</title>
  <script>
    window.onload = function () {
      if (typeof BoxedWine === 'undefined') {
        document.body.innerHTML = `
          <h2 style="color:red;">❌ BoxedWine is NOT defined</h2>
          <p>Check the following:</p>
          <ul>
            <li>Is <code>boxedwine.js</code> present in the same directory?</li>
            <li>Are you loading this over HTTPS (not <code>file://</code>)?</li>
            <li>Is the file under 100 MB? GitHub blocks large files.</li>
            <li>Open DevTools Console for more info.</li>
          </ul>`;
        return;
      }

      BoxedWine({
        arguments: ['undertale_folder/Undertale.exe'],
        locateFile: function (filename) {
          return filename;
        }
      });
    };
  </script>
  <script src="boxedwine.js"></script>
</head>
<body>
  <h1>Loading Undertale...</h1>
</body>
</html>
